- name: Add Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

# apt upgrade sırasında cluster bileşenleri kendiliğinden yükselmesin
- name: Hold Kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

# Her VM'de NAT kartının IP'si aynı (10.0.2.15); kubelet host-only IP'yi kullanmalı
- name: Set kubelet node IP
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}\n"
    mode: "0644"
  notify: Restart kubelet

- name: Configure crictl to use containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
    mode: "0644"

# kubeadm init/join tamamlanana kadar kubelet yeniden başlayıp durur; bu normaldir
- name: Enable kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
