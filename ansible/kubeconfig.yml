# Cluster'ı yönetim makinesinden (WSL, Linux veya macOS) kubectl ile kullanmak için
- name: Fetch cluster kubeconfig
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Get cluster version
      ansible.builtin.command: kubeadm version -o short
      register: cluster_version
      changed_when: false

    # Yönetici yetkisi içerir; repoya değil, kullanıcının home klasörüne yazılır
    - name: Copy kubeconfig to the control machine
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        flat: true

- name: Install kubectl on the control machine
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl_version: "{{ hostvars[groups['control_plane'][0]].cluster_version.stdout }}"
    bin_dir: "{{ lookup('env', 'HOME') }}/.local/bin"
  tasks:
    - name: Restrict kubeconfig permissions
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: "0600"

    - name: Create user bin directory
      ansible.builtin.file:
        path: "{{ bin_dir }}"
        state: directory
        mode: "0755"

    # sudo gerektirmez; sürüm cluster ile aynı tutulur
    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
        dest: "{{ bin_dir }}/kubectl"
        mode: "0755"
